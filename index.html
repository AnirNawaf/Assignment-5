<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded shadow w-80 text-center">

<h1 class="text-2xl font-bold mb-2">GitHub Issues Tracker</h1>
<p class="text-gray-500 mb-5">Sign in to continue</p>

<input id="username" type="text" placeholder="Username" class="border p-2 w-full mb-3 rounded">

<input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-3 rounded">

<button onclick="login()" class="bg-blue-500 text-white px-4 py-2 w-full rounded"> Sign In </button>

<p class="text-sm mt-3 text-gray-500">Demo: admin / admin123</p>

</div>

<script>

function login(){

const username = document.getElementById("username").value;
const password = document.getElementById("password").value;

if(username==="admin" && password==="admin123"){

window.location.href="index.html";

}
else{

alert("Invalid login");

}

}

</script>

</body>
</html>
