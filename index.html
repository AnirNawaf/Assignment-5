<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white shadow-lg rounded-xl p-8 w-[420px]">
        
        <div class="text-center mb-6">
            <img src="img/github.png" class="w-16 mx-auto mb-3">
            <h1 class="text-xl font-semibold">GitHub Issues Tracker</h1>
            <p class="text-gray-500 text-sm">Sign in to manage your issues</p>
        </div>

        <label class="text-sm font-medium">Username</label>
        <input id="username" type="text" placeholder="Enter Username"
            class="w-full border rounded-lg px-3 py-2 mt-1 mb-1">
        <p class="text-xs text-blue-600 mb-3">Default: admin</p>

        <label class="text-sm font-medium">Password</label>
        <input id="password" type="password" placeholder="Enter Password"
            class="w-full border rounded-lg px-3 py-2 mt-1 mb-1">
        <p class="text-xs text-blue-600 mb-4">Default: admin123</p>

        <button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-2 rounded-lg font-medium"> Sign In</button>

        <div class="flex items-center my-4">
            <hr class="flex-grow">
            <span class="mx-2 text-gray-400 text-sm">OR</span>
            <hr class="flex-grow">
        </div>

        <div class="bg-gray-100 p-4 rounded-lg text-center text-sm">
            <p class="text-gray-500 mb-2">Demo Credentials:</p>
            <p><b>Username:</b> admin</p>
            <p><b>Password:</b> admin123</p>
        </div>

    </div>

    <script>

        function login() {

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "admin" && password === "admin123") {

                window.location.href = "Issues.html";

            }
            else {

                alert("Invalid login");

            }

        }

    </script>

</body>
</html>
