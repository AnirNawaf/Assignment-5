<!DOCTYPE html>
<html>

<head>
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="bg-white shadow p-4 flex justify-between items-center">
        
        <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>

        <div class="flex gap-3">

            <input id="searchInput" class="border rounded px-3 py-2" placeholder="Search issues...">
            <button onclick="searchIssues()" class="bg-purple-600 text-white px-4 py-2 rounded">+ New Issue</button>
        </div>

    </div>

    <div class="p-6">

        <div class="bg-white p-4 rounded shadow mb-6">

            <button onclick="loadAll()" class="bg-purple-600 text-white px-4 py-2 rounded mr-2"> All</button>

            <button onclick="loadOpen()" class="bg-gray-200 px-4 py-2 rounded mr-2"> Open</button>

            <button onclick="loadClosed()" class="bg-gray-200 px-4 py-2 rounded"> Closed</button>

        </div>

        <div class="bg-white p-5 rounded shadow mb-6 flex justify-between items-center">

            <div>   

                <h2 class="text-xl font-semibold">
                    <span id="issueCount">0</span> Issues
                </h2>

                <p class="text-gray-500 text-sm">
                    Track and manage your project issues
                </p>

            </div>

            <div class="flex gap-4 text-sm">

                <span class="text-green-600 ">● Open</span>

                <span class="text-purple-600">● Closed</span>

            </div>

        </div>

        <div id="issuesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>

    </div>

    <script>

        const API = "https://phi-lab-server.vercel.app/api/v1/lab/issues";


        async function loadAll() {

            const res = await fetch(API);

            const data = await res.json();

            displayIssues(data.data);

        }

        function displayIssues(issues) {

            document.getElementById("issueCount").innerText = issues.length;

            const container = document.getElementById("issuesContainer");

            container.innerHTML = "";

            issues.forEach(issue => {

                const div = document.createElement("div");

                const border =
                    issue.status === "open"
                        ? "border-t-4 border-green-500"
                        : "border-t-4 border-purple-500";

                div.className = `bg-white rounded-xl shadow ${border} p-5 flex flex-col justify-between`;

                div.innerHTML = `

<div>

<div class="flex items-center justify-between mb-3">

<div class="flex justify-between mb-3">

${
    issue.status === "open" ? '<img src="img/Open-Status.png" class="w-5 h-5">' : '<img src="img/Closed- Status .png" class="w-5 h-5">' 
    
}



</div>

<span class=" ${issue.priority === 'high' ? 'bg-red-100 text-red-600' : issue.priority === 'medium' ? 'bg-yellow-100 text-yellow-600' : 
'bg-green-100 text-green-600'} px-2 py-1 rounded text-xs"> ${issue.priority.toUpperCase()}
</span>

</div>

<h2 class="font-bold text-lg mb-2">
${issue.title}
</h2>

<p class="text-gray-500 text-sm mb-3">
${issue.description.slice(0, 80)}
</p>

<div class="flex flex-wrap gap-2 mb-3">

${issue.labels.map(label => `
<span class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded">
${label}
</span>
`).join("")}

</div>

</div>

<div class="border-t pt-3 text-sm text-gray-500">

<p>#${issue.id} by ${issue.author}</p>

<p>${new Date(issue.createdAt).toLocaleDateString()}</p>

</div>


`;

container.appendChild(div);
 });

}

    async function loadOpen() {

        const res = await fetch(API);

        const data = await res.json();

        const openIssues = data.data.filter(issue => issue.status === "open");

        displayIssues(openIssues);


    }


    async function loadClosed() {

        const res = await fetch(API);

        const data = await res.json();

        const closedIssues = data.data.filter(issue => issue.status === "closed");

        displayIssues(closedIssues);

    }


    async function searchIssues() {

        const text = document.getElementById("searchInput").value;

         const res = await fetch(`https://phi-lab-server.vercel.app/api/v1/lab/issues/search?q=${text}`);

        const data = await res.json();

        displayIssues(data.data);

        }

        loadAll();

    </script>

</body>

</html>
