<!DOCTYPE html>
<html>

<head>
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="bg-white shadow p-4 flex justify-between items-center">
        
        <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>

        <div class="flex gap-3">

            <input id="searchInput" class="border rounded px-3 py-2" placeholder="Search issues...">
            <button onclick="searchIssues()" class="bg-purple-600 text-white px-4 py-2 rounded">+ New Issue</button>
        </div>

    </div>

    <div class="p-6">

        <div class="bg-white p-4 rounded shadow mb-6">

            <button onclick="loadAll()" class="bg-purple-600 text-white px-4 py-2 rounded mr-2"> All</button>

            <button onclick="loadOpen()" class="bg-gray-200 px-4 py-2 rounded mr-2"> Open</button>

            <button onclick="loadClosed()" class="bg-gray-200 px-4 py-2 rounded"> Closed</button>

        </div>

    </div>


</body>

</html>
