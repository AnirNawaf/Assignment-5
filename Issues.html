<!DOCTYPE html>
<html>

<head>
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="bg-white shadow p-4 flex justify-between items-center">
        <div class="flex gap-2 items-center justify-center ">
            <img src="img/Group (1).png" alt="">
            <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>
        </div>

        <div class="flex gap-3">
            <input id="searchInput" class="border rounded px-3 py-2" placeholder="Search issues...">
            <button onclick="searchIssues()" class="bg-[#4A00FF] text-white px-4 py-2 rounded">+ New Issue</button>
        </div>
    </div>

    <div class="p-[120px]">

        <div class="bg-white p-4 rounded shadow mb-6">
            <button id="btnAll" onclick="loadAll(this)" class="px-4 py-2 rounded mr-2">All</button>
            <button id="btnOpen" onclick="loadOpen(this)" class="px-4 py-2 rounded mr-2">Open</button>
            <button id="btnClosed" onclick="loadClosed(this)" class="px-4 py-2 rounded">Closed</button>
        </div>

        <div class="bg-white p-5 rounded shadow mb-6 flex justify-between items-center">
            <div class="flex gap-2 justify-center items-center">
                <div>
                    <img src="img/Aperture.png" alt="">
                </div>

                <div>
                    <h2 class="text-xl font-semibold">
                        <span id="issueCount">0</span> Issues
                    </h2>
                    <p class="text-gray-500 text-sm">
                        Track and manage your project issues
                    </p>
                </div>
            </div>

            <div class="flex gap-6 text-sm">
                <span class="text-green-600 ">● Open</span>
                <span class="text-purple-600">● Closed</span>
            </div>
        </div>

        <div id="issuesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="loadingSpinner" class="hidden flex justify-center items-center py-10">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-purple-600 border-t-transparent"></div>
</div>

    </div>

    <div id="issueModal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
        <div class="bg-white w-[600px] rounded-xl p-6 shadow-lg relative">

            <div class="flex justify-between items-center mb-3">
                <h2 id="modalTitle" class="text-2xl font-bold">Issue Title</h2>
            </div>

            <div class="flex items-center text-gray-500 text-sm mb-4 gap-2">
                <span id="modalStatus" class="px-3 py-1 rounded-full text-white text-xs">OPENED</span>
                <span>Opened by</span>
                <span id="modalAuthor">Fahim Ahmed</span>
                <span>•</span>
                <span id="modalDate">22/02/2026</span>
            </div>

            <div id="modalLabels" class="flex gap-2 mb-4"></div>

            <p id="modalDescription" class="text-gray-600 mb-6"></p>

            <div class="bg-gray-100 p-4 rounded-lg flex justify-between mb-6">
                <div>
                    <p class="text-gray-500 text-sm">Assignee:</p>
                    <p id="modalAssignee" class="font-semibold">Fahim Ahmed</p>
                </div>
                <div>
                    <p class="text-gray-500 text-sm">Priority:</p>
                    <span id="modalPriority" class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">HIGH</span>
                </div>
            </div>

            <div class="text-right">
                <button onclick="closeModal()"
                 class="bg-blue-700 hover:bg-blue-800 text-white px-5 py-2 rounded font-medium">
                    Close
                </button>
            </div>

        </div>
    </div>

    <script>
        const API = "https://phi-lab-server.vercel.app/api/v1/lab/issues";
        let allIssues = [];

        function setActivebtn(actvbtn) {
            const buttons = [document.getElementById("btnAll"), document.getElementById("btnOpen"), document.getElementById("btnClosed")];
            buttons.forEach(btn => {
                if (btn === actvbtn) {
                    btn.classList.add("bg-purple-600", "text-white");
                    btn.classList.remove("bg-gray-200", "text-gray-700");
                } else {
                    btn.classList.remove("bg-purple-600", "text-white");
                    btn.classList.add("bg-gray-200", "text-gray-700");
                }
            });
        }

        async function loadAll(button) {

            setActivebtn(button);
             showLoading();

            if (allIssues.length === 0) {
                const res = await fetch(API);
                const data = await res.json();
                allIssues = data.data;
                
            }

            Issue(allIssues);

            hideLoading();
        }

        function loadOpen(button) {
            setActivebtn(button);
            const openIssues = allIssues.filter(issue => issue.status === "open");
            Issue(openIssues);
        }

        function loadClosed(button) {
            setActivebtn(button);
            const closedIssues = allIssues.filter(issue => issue.status === "closed");
            Issue(closedIssues);
        }

        function Issue(issues) {
            document.getElementById("issueCount").innerText = issues.length;
            const container = document.getElementById("issuesContainer");
            container.innerHTML = "";

            issues.forEach(issue => {
                const div = document.createElement("div");
                const border = issue.status === "open" ? "border-t-4 border-green-500" : "border-t-4 border-purple-500";
                div.className = `bg-white rounded-xl shadow ${border} p-5 flex flex-col justify-between issue-card`;
                div.onclick = () => openModal(issue);

                div.innerHTML = `

                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex justify-between mb-3">
                            ${issue.status === "open" ? '<img src="img/Open-Status.png" class="w-5 h-5">' : '<img src="img/Closed- Status .png" class="w-5 h-5">'}
                        </div>
                        <span class="${issue.priority === 'high' ? 'bg-red-100 text-red-600' : issue.priority === 'medium' ? 'bg-yellow-100 text-yellow-600' : 'bg-green-100 text-green-600'} px-2 py-1 rounded-full text-xs">${issue.priority.toUpperCase()}</span>
                    </div>

                    <h2 class="font-bold text-lg mb-2">${issue.title}</h2>
                    <p class="text-gray-500 text-sm mb-3">${issue.description.slice(0, 80)}</p>


    
                    <div class="flex flex-wrap gap-2 mb-3">
                        ${issue.labels.map(label => {
                                    let icon = '';
                                    switch (label.toUpperCase()) {
                                        case 'BUG':
                                            icon = '<img src="img/Vector (7).png" class="w-3 h-3">';
                                            break;
                                        case 'HELP WANTED':
                                            icon = '<img src="img/Vector.png" class="w-3 h-3">';
                                            break;
                                        case 'ENHANCEMENT':
                                            icon = '<img src="img/Vector (7).png" class="w-3 h-3">';
                                            break;
                                        case 'GOOD FIRST ISSUE':
                                            icon = '<img src="img/Vector.png" class="w-3 h-3">';
                                            break;
                                        default:
                                            icon = '<img src="img/Vector.png" class="w-3 h-3">';
                                    }
                                    return `<span class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded flex items-center gap-1">${icon}${label.toUpperCase()}</span>`;
                                }).join('')}
                    </div>
                </div>

<div class="border-t pt-3 text-sm text-gray-500">
    <p>#${issue.id} by ${issue.author}</p>
    <p>${new Date(issue.createdAt).toLocaleDateString()}</p>
</div>
        `;
                container.appendChild(div);
            });
        }

        async function searchIssues() {
            const text = document.getElementById("searchInput").value;
            const res = await fetch(`https://phi-lab-server.vercel.app/api/v1/lab/issues/search?q=${text}`);
            const data = await res.json();
            Issue(data.data);
        }

        function openModal(issue) {
            const modal = document.getElementById("issueModal");
            modal.classList.remove("hidden");

            document.getElementById("modalTitle").innerText = issue.title;
            document.getElementById("modalDescription").innerText = issue.description;
            document.getElementById("modalAssignee").innerText = issue.assignee || "Not Assigned";

            const statusEl = document.getElementById("modalStatus");
            statusEl.innerText = issue.status.toUpperCase();
            if (issue.status === "open") {
                statusEl.className = "px-3 py-1 rounded-full text-white text-xs bg-green-500";
            } 
            else {
                statusEl.className = "px-3 py-1 rounded-full text-white text-xs bg-purple-500";
            }

            document.getElementById("modalAuthor").innerText = issue.author;
            document.getElementById("modalDate").innerText = new Date(issue.createdAt).toLocaleDateString();

            const labelsContainer = document.getElementById("modalLabels");
            labelsContainer.innerHTML = issue.labels.map(label => `<span class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded">${label}</span>`).join("");

            const modalPriority = document.getElementById("modalPriority");
            modalPriority.innerText = issue.priority.toUpperCase();
            modalPriority.className = `px-3 py-1 rounded-full text-white text-xs ${issue.priority === 'high' ? 'bg-red-500' :
                    issue.priority === 'medium' ? 'bg-yellow-500' :
                        'bg-green-500'
                }`;
        }

        function closeModal() {
            document.getElementById("issueModal").classList.add("hidden");
        }

        window.onload = () => {
            const btnAll = document.getElementById("btnAll");
            loadAll(btnAll);
        };


        function showLoading(){
    document.getElementById("loadingSpinner").classList.remove("hidden");
    document.getElementById("issuesContainer").classList.add("hidden");
}

function hideLoading(){
    document.getElementById("loadingSpinner").classList.add("hidden");
    document.getElementById("issuesContainer").classList.remove("hidden");
}




    </script>

</body>

</html>
