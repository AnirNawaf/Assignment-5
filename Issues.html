<!DOCTYPE html>
<html>

<head>
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="bg-white shadow p-4 flex justify-between items-center">
        
        <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>

        <div class="flex gap-3">

            <input id="searchInput" class="border rounded px-3 py-2" placeholder="Search issues...">
            <button onclick="searchIssues()" class="bg-purple-600 text-white px-4 py-2 rounded">+ New Issue</button>
        </div>

    </div>

    <div class="p-6">

        <div class="bg-white p-4 rounded shadow mb-6">

            <button onclick="loadAll()" class="bg-purple-600 text-white px-4 py-2 rounded mr-2"> All</button>

            <button onclick="loadOpen()" class="bg-gray-200 px-4 py-2 rounded mr-2"> Open</button>

            <button onclick="loadClosed()" class="bg-gray-200 px-4 py-2 rounded"> Closed</button>

        </div>

        <div class="bg-white p-5 rounded shadow mb-6 flex justify-between items-center">

            <div>   

                <h2 class="text-xl font-semibold">
                    <span id="issueCount">0</span> Issues
                </h2>

                <p class="text-gray-500 text-sm">
                    Track and manage your project issues
                </p>

            </div>

            <div class="flex gap-4 text-sm">

                <span class="text-green-600 ">● Open</span>

                <span class="text-purple-600">● Closed</span>

            </div>

        </div>

        <div id="issuesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>

    </div>

    <script>

        const API = "https://phi-lab-server.vercel.app/api/v1/lab/issues";


        async function loadAll() {

            const res = await fetch(API);

            const data = await res.json();

            displayIssues(data.data);

        }


        function displayIssues(issues) {

            document.getElementById("issueCount").innerText = issues.length;

            const container = document.getElementById("issuesContainer");

            container.innerHTML = "";

            issues.forEach(issue => {

                const div = document.createElement("div");

                const border =
                    issue.status === "open"
                        ? "border-t-4 border-green-500"
                        : "border-t-4 border-purple-500";


                div.className = `bg-white rounded-xl shadow ${border} p-5 flex flex-col justify-between`;

                div.innerHTML = `

<div>


    </script>

</body>

</html>
